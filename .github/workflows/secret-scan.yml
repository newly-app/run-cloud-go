# Secret scan (newly-app/newly#10622). Scans only this PR's commits with
# gitleaks; --redact keeps the secret value out of the log. Push protection
# (repo setting) blocks known key formats at push time; this also catches
# generic passwords and tokens.
#
# False positive? Add the fingerprint gitleaks prints to .gitleaksignore with a
# comment saying why. A real secret: rotate it first, then rewrite the branch.
name: secret-scan

on:
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.0
  GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none # full commit graph for the range; blobs load only for scanned commits

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan this PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --first-parent gives each merge commit a diff against the branch side, so a
        # secret added while resolving a conflict is scanned (plain log -p shows none).
        run: gitleaks git --no-banner --redact --verbose --log-opts="--first-parent ${BASE_SHA}..${HEAD_SHA}" .
